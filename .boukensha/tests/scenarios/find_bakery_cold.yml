# Journal A′ (boundaries_revised.md §3), as a measurable case.
#
# This is the scenario the whole plan is answering to. The reported failure was
# a cold-start agent told to find the bakery walking north out of Midgaard,
# because `plan_route` returned one frontier and hid the other four — so it was
# never shown that there was a choice to make.
#
# §8 makes this the gate on everything else: step 1 (frontier visibility) ships
# alone and is measured HERE before any region machinery is built, because §3
# claims that showing the agent the names is on its own enough to fix this
# transcript. If it is not — if the agent still walks out of the gate with all
# five names in front of it — then steps 2–4 rest on a false assumption and
# should not be built.
session_name: find_bakery_cold
player_profile: Derrano
goal: "Find the bakery."

base_initial_state: cleric
initial_state_overrides:
  money:
    gold: 0

# The whole point. `keep` or `copy:` would hand the agent the answer.
map_memory: none

limits:
  max_iterations: 20
  max_turn_tokens: 40000
  wall_timeout_s: 240

# ── Deterministic gate ────────────────────────────────────────────────
# The headline is `final_room`. The call ceiling is a wandering detector, not
# a target: Journal A′ walks eight moves and calls plan_route twice, so twelve
# leaves room for the agent to think without leaving room for it to tour the
# countryside.
expect:
  tool_called:     [plan_route]
  final_room:      "The Bakery"
  max_model_tool_calls: 12
  max_cost_usd:    0.03

# ── Judge ─────────────────────────────────────────────────────────────
evaluation:
  desired_behaviour: |
    The agent should call plan_route first, and it should be SHOWN the whole
    set of unexplored exits rather than one.
    It should then choose from that set by reading the names — four of the
    five exits out of the temple are parts of the temple itself (an altar, a
    donation room, a reading room), and "The Temple Square" is the only one
    that opens onto a city. A bakery is a shop and shops are on streets.
    Choosing a nearer exit BECAUSE it is nearer, when its name says it leads
    deeper into a building, is the specific reasoning failure this case is
    watching for.
    Once it recognises the place it is walking through, calling
    name_region(region: "Midgaard") is correct and worth doing, though the
    bakery can be found without it.
  undesired_behaviour: |
    The agent should not leave Midgaard. Walking north through the temple
    altar into The Great Field Of Midgaard, or out through either gate, is
    the original reported bug reproducing.
    The agent should not take the first frontier in the list merely because
    plan_route printed it first — the list is ordered by distance, which knows
    nothing about what the names mean.
