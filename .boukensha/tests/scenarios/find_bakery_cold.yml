# Journal A′ (boundaries_revised.md §3), as a measurable case.
#
# This is the scenario the whole plan is answering to. The reported failure was
# a cold-start agent told to find the bakery walking north out of Midgaard,
# because `plan_route` returned one frontier and hid the other four — so it was
# never shown that there was a choice to make.
#
# §8 makes this the gate on everything else: step 1 (frontier visibility) ships
# alone and is measured HERE before any region machinery is built, because §3
# claims that showing the agent the names is on its own enough to fix this
# transcript. If it is not — if the agent still walks out of the gate with all
# five names in front of it — then steps 2–4 rest on a false assumption and
# should not be built.
session_name: find_bakery_cold
player_profile: Derrano
goal: "Find the bakery."

base_initial_state: cleric
initial_state_overrides:
  money:
    gold: 0

# The whole point. `keep` or `copy:` would hand the agent the answer.
map_memory: none

limits:
  max_iterations: 20
  max_turn_tokens: 40000
  wall_timeout_s: 240

# ── Deterministic gate ────────────────────────────────────────────────
# The headline is `final_room`. The call ceiling is a wandering detector, not
# a target: Journal A′ walked eight moves and called plan_route twice, and
# under move_to the whole of that is one or two calls — so twelve has stopped
# detecting anything and comes down to six. Provisional until the §9 step 8
# sweep measures it.
expect:
  tool_called:     [move_to]
  final_room:      "The Bakery"
  max_model_tool_calls: 6
  max_cost_usd:    0.03

# ── Judge ─────────────────────────────────────────────────────────────
evaluation:
  desired_behaviour: |
    The agent should call move_to(destination: "bakery") and then let it work,
    rather than calling it once per room.
    The frontier reasoning has moved inside move_to (move_to.md §2), so this
    case is now read from the navigator's decisions in the session log as much
    as from the player's trace. The navigator is shown all five unexplored
    exits out of the temple with their names, and should choose from that set
    by reading them: four are parts of the temple itself (an altar, a donation
    room, a reading room), and "The Temple Square" is the only one that opens
    onto a city. A bakery is a shop and shops are on streets. Choosing a nearer
    exit BECAUSE it is nearer, when its name says it leads deeper into a
    building, is the specific reasoning failure this case watches for, and the
    navigator's `reason` field is where it shows.
    The navigator should also answer `place: "Midgaard"` once it can tell —
    the region starts as a machine-made ⟨from The Temple Of Midgaard⟩ — and the
    subsystem should apply it, so the run ends with a named, confirmed region.
    A `place` derived from the room name (calling the place "The Temple Of
    Midgaard") is wrong: the temple is IN Midgaard.
  undesired_behaviour: |
    The agent should not leave Midgaard. Walking north through the temple
    altar into The Great Field Of Midgaard, or out through either gate, is
    the original reported bug reproducing.
    The navigator should not take the first frontier in the list merely because
    it was printed first — the list is ordered by distance, which knows nothing
    about what the names mean.
    The player should not call move_to once per room, and should not narrate
    walking single directions: it has no tool for that.
