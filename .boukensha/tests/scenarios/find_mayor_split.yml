# Journal C′ (boundaries_revised.md §5), as a measurable case.
#
# The region has stopped narrowing anything, and the question is whether the
# agent notices. §5's argument is that the COUNT would not have told it — twelve
# exits in Journal A′ was a dense little town where scope was working perfectly
# — and the distances would: sixteen doors at a median of six, half of them
# withheld because they are six to twelve moves off, is a scope that has
# stopped meaning "here".
#
# Nothing in the code branches on either number. Both are printed on one line
# and the judgement is the model's, which is exactly what this case measures.
#
# The declaration under test is a NESTED split — `within: "Midgaard"` — because
# quarters nest rather than partition. Replacing Midgaard with three peers would
# make "is this in town at all?" unanswerable, and that question is the original
# bug.
#
# NOTE ON THE MAP: as with find_hermit_mapped, this needs a mapped Midgaard
# captured as `snapshot:midgaard`. This case needs the fullest map of the three
# — §5's whole argument is a median of six over sixteen doors, and a small map
# has no such median to read, so the reasoning under test would simply not be
# reachable.
session_name: find_mayor_split
player_profile: Derrano
goal: "Find the mayor's office."

base_initial_state: cleric
initial_state_overrides:
  money:
    gold: 0

map_memory: snapshot:midgaard

limits:
  max_iterations: 20
  max_turn_tokens: 40000
  wall_timeout_s: 240

expect:
  tool_called:     [move_to]
  # Was 14. Provisional until the §9 step 8 sweep.
  max_model_tool_calls: 8
  max_cost_usd:    0.03

evaluation:
  desired_behaviour: |
    This case measures the region machinery inside move_to (move_to.md §5),
    not the player's own tool calls, so read the session's navigation journal
    and the subagent turns as well as the player's trace.
    The navigator is given the region shape line — room count, unexplored exit
    count, nearest and median distance — on every decision above the scope
    gate, and should use the DISTANCES rather than the count to judge whether
    the label has stopped meaning "here". A large median with exits withheld
    far away is the signal; a dozen exits at a median of one move in a dense
    little town is scope working correctly and must NOT raise it.
    Where the map shows a distinct quarter hanging off a single entrance — a
    bridge, a gate, a stair — the cartographer should place the boundary on
    that entrance with `within:` set to the town, so the quarter nests inside
    it rather than replacing it and a search starting elsewhere in town still
    scopes to the whole of it.
    A mayor's office is civic and central, so the navigator should prefer
    avenues and promenades over cellars and back alleys, and its `reason`
    should say so.
  undesired_behaviour: |
    The boundary should not land on an interior edge — one where the two sides
    still connect by several other routes. The cartographer is given the whole
    room graph precisely so it can avoid this, and a split it cannot justify
    from a single entrance should have been declined instead.
    A large-but-coherent region should not be split at all. Every room being a
    street or a square that interconnects in every direction is not a scope
    problem, and a boundary drawn anyway is worse than none: declarations are
    never overwritten, so it permanently mis-scopes every later route plan in
    that area.
    The agent should not use name_region where it means split_region. Naming
    renames the WHOLE region it is standing in, and the room count printed
    back will say so.
    The agent should not try to carve a quarter out of already-mapped
    territory it did not just walk into — there is no arrival edge to make a
    boundary of, and re-parenting the whole region is what is offered instead.
