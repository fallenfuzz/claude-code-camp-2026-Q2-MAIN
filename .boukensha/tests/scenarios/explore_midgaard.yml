# The FIXTURE run — mocking_messages.md §5 and §13 step 1.
#
# This case exists to be snapshotted, not to be passed. Three other scenarios
# declare `map_memory: snapshot:midgaard` and none of them can run until that
# file exists:
#
#   find_mayor_split          C′, boundaries_revised.md §5
#   split_the_bridge_quarter  run A — the first live cartographer call
#   detect_the_sprawl         run B — the first measured `scope_suspect`
#
# §5's argument is why a small map will not do. `find_mayor_split` needs "the
# fullest map of the three" because the reasoning under test is a MEDIAN — a
# dozen unexplored exits at a median of one move is a dense little town where
# scope is working correctly, and sixteen at a median of six is a scope that has
# stopped meaning "here". A seven-room map has no such median to read, so the
# judgement is not merely hard to reach, it is not present in the data at all.
# The same is true of the cartographer: given a seven-room graph it will decline
# to split, and declining will have been the right answer.
#
# ── HOW TO TURN THIS INTO THE FIXTURE ──────────────────────────────────
#
#   bk -ts explore_midgaard                 # one paid run, ~4 minutes
#   # read the run log for the session id it retained, then:
#   bk --snapshot-map midgaard --profile Derrano --from-session <session_id>
#   # -> .boukensha/tests/knowledge/snapshots/midgaard.sqlite3
#
# `--from-session` rather than the live profile, because by the time this run
# has been read the profile's map belongs to whatever ran next. Every case
# retains its ending map under `tests/knowledge/sessions/<profile>/`, and that
# copy is the one worth pinning.
#
# Check what you captured before committing to it. Anything under about thirty
# rooms and both banks of the river is not a mapped Midgaard, and the three
# cases above will quietly measure something else:
#
#   sqlite3 .boukensha/tests/knowledge/snapshots/midgaard.sqlite3 \
#     "SELECT (SELECT COUNT(*) FROM rooms), (SELECT COUNT(*) FROM room_exits WHERE target_room_id IS NULL)"
#
# ── WHAT IS AND IS NOT GATED ───────────────────────────────────────────
#
# Whether the map is GOOD ENOUGH is not gated and cannot be. That is a question
# about the shape of a database — thirty-odd rooms, both banks of the river — and
# it is asked by the sqlite3 line above rather than by an `expect:` block.
# `rooms_known_delta` in the report is the number to read.
#
# The agent's CONDUCT is gated, as of fix_surveying.md §5. Run
# 20260731T140528Z-34c846bf issued twenty-one model tool calls, all of them
# `move_to`, twelve of which answered `unreachable` and walked nothing, and asked
# for "The South Gate" nine times while standing beside its unwalked exit. It
# satisfied `tool_called: [move_to]` and every budget rule in the suite. The two
# ceilings below are the cheapest statement of the difference between spending the
# budget and covering ground, and both read `move_to`'s `answered` journal event:
#
#   no_progress_calls        calls that walked zero rooms      recorded: 14 of 21
#   max_destination_repeats  times one destination was asked   recorded: 9
#
# The fourteen are the twelve `unreachable` answers, one blocked exit, and one
# `arrived` from where the agent already stood. It is not the fifteen the
# diagnosis counts, and the gap is deliberate: two further calls walked one room
# north and one room back south, which a reader calls waste and no projection can.
#
# A third ceiling arrives with staying_in_town.md §13, and it gates something the
# other two cannot see at all:
#
#   rooms_outside_scope      rooms behind a recorded egress   recorded: 15 of 41
#
# Run 20260731T171650Z-09259cd5 is the first `explore_midgaard` to pass every
# mechanical gate and fail on the judge alone. It covered ground extremely well —
# forty-one rooms, eight regions, both gates, the wall road and the bridge — and
# fifteen of those rooms are countryside outside the walls, which no `expect:`
# rule in the suite could state. The rule the run was graded on lived only in
# `evaluation.undesired_behaviour`, where the judge reads it and the agent cannot,
# so it appears in `goal` as well as of today. That split is right for questions
# about CONDUCT, where an agent told it will be marked down for repeating a
# destination learns to hide the repetition rather than to stop needing it, and
# wrong for a constraint on the task itself: a constraint the agent cannot read
# can only be satisfied by luck, and a run that satisfies it by luck teaches
# nothing.
session_name: explore_midgaard
player_profile: Derrano
goal: >-
  Walk Midgaard and learn its layout. Cover both banks of the river and as many
  distinct streets, squares and quarters as you can reach, rather than following
  one road to its end. You are not looking for anything in particular — the walk
  itself is the point.

  Stay inside Midgaard. The gates, the wall road and the bridge are the edges of
  the town and are worth walking; the fields, roads and trails beyond them are
  not part of this walk.

base_initial_state: cleric
initial_state_overrides:
  money:
    gold: 0

# Cold, so the captured map is one run's work and nothing inherited. A snapshot
# built on top of a `keep` map would carry region declarations from runs nobody
# can identify, and declarations are earned and never overwritten.
map_memory: none

# Generous, because this is the one case whose value is proportional to how far
# it gets. It is also the most expensive case in the suite by some margin, which
# is the argument for running it ONCE and replaying the result forever.
limits:
  max_iterations: 40
  max_turn_tokens: 120000
  wall_timeout_s: 900

expect:
  tool_called: [move_to]
  max_no_progress_calls: 3
  max_destination_repeats: 2
  # staying_in_town.md §13. Run 20260731T171650Z-09259cd5 passed both ceilings
  # above — one no-progress call of twenty, two repeats against a ceiling of two —
  # and mapped forty-one rooms of which fifteen were countryside outside the city
  # walls, because both of those measure how much the budget bought and neither
  # measures where. This counts rooms not reachable from the room the session's
  # walking began in without crossing an edge recorded as an egress, so it is
  # deterministic and attributable to the leg that caused it.
  #
  # Zero, and it is reachable rather than aspirational: the navigator's
  # `leaves_region` veto refuses the step BEFORE the movement command is sent, so
  # a walk that would have gone through a gate stops inside it. A small non-zero
  # allowance is defensible if walking one room past a gate to confirm it is a
  # gate turns out to be worth having, but it should be argued for on evidence
  # rather than set as a cushion.
  max_rooms_outside_scope: 0

evaluation:
  desired_behaviour: |
    The agent should use move_to repeatedly with different destinations and let
    the navigator spread the walk across the frontier, rather than walking one
    corridor to its end and back.
    It should name the region it is in — the map starts as a machine-made
    ⟨from The Temple Of Midgaard⟩ — so the fixture this run produces begins with
    a confirmed label rather than provenance.
  undesired_behaviour: |
    The agent should not leave Midgaard for the countryside or the wilderness.
    A map that is half town and half open field is a worse fixture than a
    smaller map that is all town, because every case that replays it is asking
    a question about a town.
    It should not spend the whole budget on one quarter. Coverage is the output.
