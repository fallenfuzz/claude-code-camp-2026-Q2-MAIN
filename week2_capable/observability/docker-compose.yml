x-collector: &collector
  image: otel/opentelemetry-collector-contrib:0.157.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
    interval: 10s
    timeout: 5s
    retries: 3
  ports:
    - "127.0.0.1:4317:4317"
    - "127.0.0.1:4318:4318"

services:
  collector-debug:
    <<: *collector
    profiles: [debug]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/debug.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:55679:55679"

  collector-jaeger:
    <<: *collector
    profiles: [jaeger]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/jaeger.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  collector-tempo:
    <<: *collector
    profiles: [tempo]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/tempo.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  collector-compare:
    <<: *collector
    profiles: [compare]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/compare.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
      tempo:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    profiles: [jaeger, compare]
    restart: unless-stopped
    command:
      - --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317
      - --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
    ports:
      - "127.0.0.1:16686:16686"

  tempo:
    image: grafana/tempo:2.10.5
    profiles: [tempo, compare]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [tempo, compare]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${BOUKENSHA_GRAFANA_PORT:-3001}:3000"
    depends_on:
      tempo:
        condition: service_started

volumes:
  tempo-data:
  grafana-data:
